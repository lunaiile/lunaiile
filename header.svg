<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#58a6ff"/>
      <animate attributeName="x1" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6edf3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e6edf3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)" rx="12"/>

  <!-- Crescent moon, top right -->
  <g transform="translate(800,60)">
    <circle cx="0" cy="0" r="55" fill="url(#moonglow)">
      <animate attributeName="r" values="50;58;50" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M 25 -30
             A 32 32 0 1 0 25 30
             A 24 24 0 1 1 25 -30 Z"
          fill="#e6edf3" opacity="0.85"/>
    <!-- small stars -->
    <circle cx="-60" cy="-20" r="2" fill="#e6edf3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-40" cy="20" r="1.5" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="10" cy="-45" r="1.5" fill="#e6edf3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated typing text -->
  <text x="40" y="90" font-family="Consolas, monospace" font-size="34" font-weight="bold" fill="url(#glow)">
    Hi, I'm Kamar
    <animate attributeName="opacity" values="0;1;1" dur="1.2s" fill="freeze"/>
  </text>

  <text x="40" y="135" font-family="Consolas, monospace" font-size="18" fill="#8b949e">
    Computer Science Graduate &#183; AI &amp; Software Development
    <animate attributeName="opacity" values="0;0;1" dur="2.5s" fill="freeze"/>
  </text>

  <text x="40" y="170" font-family="Consolas, monospace" font-size="16" fill="#56d364">
    &gt; Python &#183; Java &#183; React &#183; Flutter &#183; MySQL
    <animate attributeName="opacity" values="0;0;0;1" dur="3.8s" fill="freeze"/>
  </text>

  <!-- blinking cursor -->
  <rect x="430" y="155" width="10" height="18" fill="#56d364">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
